name: Build macOS app

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    env:
      CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
      DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
    steps:
      # v5 runs on Node.js 24; v4 is deprecated on current hosted runners.
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
      - name: Validate package metadata
        run: |
          bash -n scripts/build-app.sh
          plutil -lint Resources/Info.plist
          swift package dump-package > /dev/null
      - name: Run tests
        run: |
          set -o pipefail
          swift test 2>&1 | tee swift-test.log
      - name: Install Developer ID certificate
        if: ${{ env.DEVELOPER_ID_P12_BASE64 != '' }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/notchwork-signing.keychain-db"
          echo "$DEVELOPER_ID_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p runner "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p runner "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -P "$DEVELOPER_ID_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k runner "$KEYCHAIN"
      - name: Build app and DMG
        run: |
          set -o pipefail
          NOTCHWORK_UNIVERSAL=1 ./scripts/build-app.sh 2>&1 | tee build-app.log
      - name: Notarize DMG
        if: ${{ env.CODESIGN_IDENTITY != '' && env.APPLE_ID != '' && env.APPLE_TEAM_ID != '' && env.APPLE_APP_PASSWORD != '' }}
        run: |
          xcrun notarytool submit "dist/Notch-Work.dmg" --wait \
            --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID"
          xcrun stapler staple "dist/Notch-Work.dmg"
      - name: Verify bundle
        run: |
          codesign --verify --deep --strict --verbose=2 "dist/Notch Work.app"
          lipo "dist/Notch Work.app/Contents/MacOS/NotchWork" -verify_arch arm64 x86_64
          plutil -lint "dist/Notch Work.app/Contents/Info.plist"
          test -s "dist/Notch-Work.dmg"
      - name: Upload downloadable DMG
        # v6 runs on Node.js 24; older majors still target Node.js 20.
        uses: actions/upload-artifact@v6
        with:
          name: Notch-Work-macOS
          path: dist/Notch-Work.dmg
          if-no-files-found: error
          retention-days: 30
      - name: Publish direct download
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$RUNNER_TEMP/release-notes.md"
          cat > "$NOTES" <<'EOF'
          Автоматическая актуальная сборка Notch Work для macOS 14+ (Apple Silicon и Intel).

          1. Скачайте `Notch-Work.dmg`.
          2. Откройте образ.
          3. Запустите `Установить Notch Work.command` — он установит и сразу откроет приложение.

          Если сборка подписана и нотарифицирована Apple, приложение также можно перетащить в Applications и открыть обычным двойным нажатием.
          EOF
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title "Notch Work — актуальная сборка" --notes-file "$NOTES" --prerelease --latest=false
          else
            gh release edit latest --title "Notch Work — актуальная сборка" --notes-file "$NOTES" --prerelease --latest=false
          fi
          gh release upload latest "dist/Notch-Work.dmg" --clobber
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Notch-Work-build-logs
          path: |
            swift-test.log
            build-app.log
          if-no-files-found: warn
          retention-days: 7
      - name: Remove signing keychain
        if: ${{ always() && env.DEVELOPER_ID_P12_BASE64 != '' }}
        run: security delete-keychain "$RUNNER_TEMP/notchwork-signing.keychain-db" || true
