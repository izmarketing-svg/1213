name: Build macOS app

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      # v5 runs on Node.js 24; v4 is deprecated on current hosted runners.
      - uses: actions/checkout@v5
      - name: Show toolchain
        run: swift --version
      - name: Run tests
        run: |
          set -o pipefail
          swift test 2>&1 | tee swift-test.log
      - name: Build app and DMG
        run: |
          set -o pipefail
          ./scripts/build-app.sh 2>&1 | tee build-app.log
      - name: Verify bundle
        run: |
          codesign --verify --deep --strict --verbose=2 "dist/Notch Work.app"
          test -s "dist/Notch-Work.dmg"
      - name: Upload downloadable DMG
        # v6 runs on Node.js 24; older majors still target Node.js 20.
        uses: actions/upload-artifact@v6
        with:
          name: Notch-Work-macOS
          path: dist/Notch-Work.dmg
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Notch-Work-build-logs
          path: |
            swift-test.log
            build-app.log
          if-no-files-found: warn
          retention-days: 7
